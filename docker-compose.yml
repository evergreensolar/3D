# Local services for development: PostgreSQL + MinIO (S3-compatible).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: evergreen, POSTGRES_PASSWORD: evergreen, POSTGRES_DB: evergreen }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
volumes: { pgdata: {}, minio: {} }
